# Lefthook config - optional local quality gates.
# Replace placeholder commands during project initialization.

pre-commit:
  commands:
    verify:
      run: "npm run build"
      tags: quality

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg_file="{1}"
        first_line=$(head -n 1 "$msg_file")
        case "$first_line" in
          feat:*|fix:*|docs:*|chore:*|refactor:*|test:*|style:*|perf:*|build:*|ci:*|revert:*|feat\(*|fix\(*|docs\(*|chore\(*|refactor\(*|test\(*|style\(*|perf\(*|build\(*|ci\(*|revert\(*)
            exit 0
            ;;
          *)
            echo "Commit message must use Conventional Commits, e.g. feat: add export flow"
            exit 1
            ;;
        esac
      tags: quality

pre-push:
  commands:
    full-check:
      run: "npm run build"
      tags: quality
